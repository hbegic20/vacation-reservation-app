services:
  - type: web
    name: vacation-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      npm ci --include=dev &&
      npm run prisma:generate -w @vacation/api &&
      npm run build -w @vacation/api &&
      npm run prisma:deploy -w @vacation/api
    startCommand: npm run start -w @vacation/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: ""
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
